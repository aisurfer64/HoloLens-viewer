<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRISM Medical Device</title>
  <style>
    :root {
      /* How much of Sketchfab's own bars and edge buttons to push off-screen */
      --crop-top: 90px;
      --crop-bottom: 90px;
      --crop-side: 24px;
      --divider: 4px solid #f2f0f1;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .split {
      position: fixed;
      inset: 0;
      display: flex;
    }
    .panel {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .device iframe {
      position: absolute;
      left: calc(-1 * var(--crop-side));
      top: calc(-1 * var(--crop-top));
      width: calc(100% + 2 * var(--crop-side));
      height: calc(100% + var(--crop-top) + var(--crop-bottom));
      border: 0;
      display: block;
    }
    .plaque {
      /* matches the Sketchfab scene background on the left */
      background: #938a8f;
      border-left: var(--divider);
    }
    .plaque canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    .plaque canvas:active {
      cursor: grabbing;
    }
    /* Phones held upright: stack the device above the plaque */
    @media (orientation: portrait) {
      .split {
        flex-direction: column;
      }
      .plaque {
        border-left: 0;
        border-top: var(--divider);
      }
    }
  </style>
</head>
<body>
  <div class="split">
    <section class="panel device">
      <iframe
        title="PRISM Medical Device"
        allowfullscreen
        mozallowfullscreen="true"
        webkitallowfullscreen="true"
        allow="autoplay; fullscreen; xr-spatial-tracking"
        xr-spatial-tracking
        execution-while-out-of-viewport
        execution-while-not-rendered
        web-share
        src="https://sketchfab.com/models/3dd665394e6f4b62ba16338e55828ddd/embed?autostart=1&preload=1&ui_theme=dark&ui_hint=0&ui_infos=0&ui_watermark=0&ui_watermark_link=0&ui_help=0&ui_settings=0&ui_inspector=0&ui_annotations=0&ui_stop=0&ui_vr=0&ui_ar=0&ui_ar_help=0&ui_ar_qrcode=0&ui_controls=0&ui_color=000000">
      </iframe>
    </section>
    <section class="panel plaque" aria-label="United States patent plaque">
      <canvas></canvas>
    </section>
  </div>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
  <script type="module" src="plaque.js"></script>
</body>
</html>
